name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved package version already committed on main
        required: true
      publish:
        description: Publish the verified tarball to npm (requires protected environment approval)
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      STORYBOOK_DISABLE_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/release-guard.mjs
        id: version
      - run: npm run check
      - run: npm run build-storybook
      - run: npm run test:consumers
      - run: npm run test:browser
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: approved-package
          path: artifacts/fieldnotes-ui.tgz
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: approved-package
          path: artifacts
      - run: npm publish artifacts/fieldnotes-ui.tgz --access public --provenance
      - run: gh release create "v${RELEASE_VERSION}" --target "${GITHUB_SHA}" --title "v${RELEASE_VERSION}" --notes-file CHANGELOG.md
