name: Publish approved release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact approved package version already committed on main
        required: true
      publish:
        description: Publish the verified tarball to npm (requires protected environment approval)
        type: boolean
        default: false
        required: true
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      EXPECTED_VERSION: ${{ inputs.version }}
      PUBLISH_REQUESTED: ${{ inputs.publish }}
      STORYBOOK_DISABLE_TELEMETRY: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/release-guard.mjs
        id: version
      - run: npm run check
      - run: npm run build-storybook
      - run: npm run test:consumers
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: approved-package
          path: artifacts/fieldnotes-ui.tgz
  publish:
    if: inputs.publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
      issues: write
    env:
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: approved-package
          path: artifacts
      - run: npm publish artifacts/fieldnotes-ui.tgz --access public --provenance
      - name: Create GitHub release if it was not already released separately
        run: |
          if ! gh release view "v${RELEASE_VERSION}" --json url; then
            gh release create "v${RELEASE_VERSION}" --target "${GITHUB_SHA}" --title "v${RELEASE_VERSION}" --notes-file CHANGELOG.md
          elif [ "$(gh release view "v${RELEASE_VERSION}" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "v${RELEASE_VERSION}" --draft=false
          fi
      # Releases made by GITHUB_TOKEN do not trigger release-event workflows.
      - name: Close the released milestone
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          milestone_number="$(gh api --paginate "repos/$GH_REPO/milestones?state=all" --jq '.[] | select(.title == env.RELEASE_VERSION) | .number')"
          if [ -n "$milestone_number" ]; then
            gh api --method PATCH "repos/$GH_REPO/milestones/$milestone_number" -f state=closed
          fi
