name: Prepare version
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: version-preparation
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v1
        with:
          version: npm run version:prepare
          title: 'chore: prepare package release'
          commit: 'chore: prepare package release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
