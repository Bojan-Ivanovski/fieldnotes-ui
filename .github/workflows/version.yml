name: Prepare version
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: version-preparation
  cancel-in-progress: false
jobs:
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Select the Changesets operation
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
      - uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        if: steps.mode.outputs.mode == 'version'
        with:
          script: npm run version:prepare
          pr-title: 'chore: prepare package release'
          commit-message: 'chore: prepare package release'
