version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Keep types aligned with the minimum supported and CI-tested Node version.
      - dependency-name: '@types/node'
        versions: ['>=25.0.0']
      # typescript-eslint 8.71.2 requires TypeScript <6.1.0.
      # Revisit this ceiling when upgrading the lint/compiler toolchain together.
      - dependency-name: typescript
        versions: ['>=6.1.0']
    groups:
      storybook:
        patterns: ['storybook', '@storybook/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
